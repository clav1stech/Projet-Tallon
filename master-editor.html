<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trajets · Atelier Tallon</title>
    <link rel="stylesheet" href="css/editor.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
</head>
<body>
    <div id="editor-shell"></div>

    <main class="doc-main">
        <section class="card toolbar" aria-label="Trajet édité">
            <label class="field">
                <span>Trajet</span>
                <select id="route-picker"></select>
            </label>
            <label class="field narrow">
                <span>Voie de circulation</span>
                <select id="voie-picker">
                    <option value="1">Voie 1 · Paris → Province</option>
                    <option value="2">Voie 2 · Province → Paris</option>
                </select>
            </label>
            <label class="toggle">
                <input id="anomalies-only" type="checkbox">
                Anomalies seulement
            </label>
            <span class="toolbar-spacer"></span>
            <div class="toolbar-actions">
                <button id="undo-btn" class="btn ghost" type="button" disabled title="Annuler (⌘Z / Ctrl+Z)">
                    <i class="fas fa-undo" aria-hidden="true"></i> Annuler
                </button>
                <button id="add-point-btn" class="btn" type="button">
                    <i class="fas fa-plus" aria-hidden="true"></i> Point en fin
                </button>
                <button id="duplicate-route-btn" class="btn" type="button">
                    <i class="far fa-copy" aria-hidden="true"></i> Dupliquer
                </button>
                <button id="export-btn" class="btn primary" type="button">
                    <i class="fas fa-file-export" aria-hidden="true"></i> Exporter JSON
                </button>
            </div>
        </section>

        <section class="card stats" id="route-stats" aria-label="Synthèse du trajet"></section>

        <section class="card speed-strip" aria-label="Vitesse moyenne par segment">
            <div class="speed-strip-head">
                <span class="speed-strip-title">Vitesse moyenne par segment</span>
                <span class="legend">
                    <span>largeur ∝ distance · hauteur ∝ vitesse</span>
                    <a id="profile-link" href="route-profile.html">Profil détaillé →</a>
                </span>
            </div>
            <div id="speed-bars" class="speed-bars"></div>
        </section>

        <div id="editor-status" class="editor-status" role="status"></div>

        <ol id="points-list" class="route-list" aria-label="Points et segments du trajet"></ol>
    </main>

    <script type="module" src="js/master-editor.js"></script>
</body>
</html>
