<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Routes Editor</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container editor-container">
        <h1>Master Routes Editor</h1>

        <div class="form-row">
            <label for="route-picker"><i class="fas fa-route"></i> Master route :</label>
            <select id="route-picker"></select>
        </div>

        <div class="editor-toolbar">
            <button id="add-point-btn" class="btn">+ Ajouter un point</button>
            <button id="duplicate-route-btn" class="btn secondary">Dupliquer la route</button>
            <button id="export-btn" class="btn primary">Exporter JSON</button>
            <span id="dirty-indicator" class="dirty-indicator">Modifications non sauvegardées</span>
        </div>

        <aside class="editor-summary">
            <h3>Résumé</h3>
            <ul>
                <li>
                    <strong>Voie :</strong>
                    <select id="voie-picker">
                        <option value="1">Voie 1 (Paris → Province)</option>
                        <option value="2">Voie 2 (Province → Paris)</option>
                    </select>
                </li>
                <li><strong>Points :</strong> <span id="summary-points">0</span></li>
                <li><strong>Durée totale :</strong> <span id="summary-duration">0 s</span></li>
                <li><strong>Distance totale :</strong> <span id="summary-distance">0 km</span></li>
            </ul>
            <p class=”hint”>Les modifications sont locales. Utilisez “Exporter JSON” pour récupérer le fichier mis à jour.</p>

        </aside>

        <div class="editor-list-wrapper" id="points-list"></div>

        <div id="editor-messages" class="editor-messages"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/js/all.min.js" defer></script>
    <script type="module" src="js/master-editor.js"></script>
</body>
</html>
