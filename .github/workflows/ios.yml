name: iOS

# Produit un IPA NON SIGNÉ, à signer et installer avec Sideloadly (identifiant
# Apple gratuit, voir docs/ios-sideloadly.md). Aucun certificat ni identifiant
# Apple n'est stocké dans le dépôt ou les secrets GitHub.
#
# Déclenchement manuel uniquement (Actions → iOS → Run workflow) pour ne pas
# consommer de minutes macOS à chaque push. La validation automatique reste
# portée par ci.yml.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Pas d'IPA si la partie web embarquée est cassée.
      - run: npm ci
      - run: npm run check:syntax
      - run: npm test

      - name: Ressources web (liste de précache de sw.js)
        run: node ios/copy-web.mjs

      - name: Génération du projet Xcode
        run: |
          brew install xcodegen
          xcodegen --version
          cd ios && xcodegen generate

      - name: Version
        id: version
        run: echo "marketing=$(grep -m1 -oE '^## v[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | cut -c5-)" >> "$GITHUB_OUTPUT"

      - name: Compilation non signée
        run: |
          xcodebuild -version
          xcodebuild build \
            -project ios/Tallon.xcodeproj -scheme Tallon -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="${{ steps.version.outputs.marketing }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" | tee ios/build.log
          # Une méthode de délégué dont la signature ne correspond plus au SDK
          # n'est qu'un avertissement, mais elle n'est alors jamais appelée.
          ! grep -n "nearly matches" ios/build.log

      - name: Empaquetage IPA
        run: |
          app=ios/build/Build/Products/Release-iphoneos/Tallon.app
          test -f "$app/www/index.html"
          mkdir -p ios/build/ipa/Payload
          cp -R "$app" ios/build/ipa/Payload/
          cd ios/build/ipa && zip -qry ../Tallon.ipa Payload
          ls -l ../Tallon.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Tallon-ipa-${{ steps.version.outputs.marketing }}-${{ github.run_number }}
          path: ios/build/Tallon.ipa
          if-no-files-found: error
          retention-days: 30
