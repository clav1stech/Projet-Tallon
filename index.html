<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Railway Timeline</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
</head>

<body>
    <div class="container">
        <h1>Railway Timeline</h1>

        <div class="form-row">
            <label for="routeSelect"><i class="fas fa-route"></i> Trajet principal :</label>
            <select id="routeSelect">
                <option value="">-- Choisir la destination --</option>
            </select>
        </div>

        <div class="form-row" id="stopsRow">
            <label><i class="fas fa-flag-checkered"></i> Arrêts intermédiaires :</label>
            <div id="stopCheckboxes" class="checkbox-group">
                <span class="hint">Sélectionnez une destination pour afficher les arrêts.</span>
            </div>
        </div>

        <div class="form-row">
            <label for="departure-time"><i class="far fa-clock"></i> Departure time (HH:MM):</label>
            <input type="time" id="departure-time" required>
        </div>

        <!-- Champ : décalage global ΔT -->
        <div class="form-row">
            <label for="global-delta">
                <i class="far fa-clock"></i> Global time offset (minutes):
            </label>
            <div class="delta-wrapper">
                <button type="button" id="delta-minus" class="delta-btn">-</button>
                <input type="number" id="global-delta" step="1" min="-30" max="30" placeholder="0" inputmode="numeric">
                <button type="button" id="delta-plus" class="delta-btn">+</button>
            </div>
        </div>

        <button id="start-btn" class="start-btn">Start</button>

        <!-- widget -->
        <div id="tracking-widget" class="tracking-widget">
            <div class="widget-section card dual-stops">
                <div class="widget-line combined" id="last-line"></div>
                <div class="widget-line combined" id="next-line"></div>
            </div>
            <div class="widget-section status">
                <div class="section-header">
                    <i class="fas fa-stopwatch"></i>
                    <span class="widget-title">Statut temps réel</span>
                </div>
                <div class="status-chip">
                    <span id="current-time"></span>
                </div>
            </div>
        </div>

        <br>

        <div id="timeline">
            <div class="station header">
                <span>Time</span>
                <span>Waypoint</span>
            </div>
        </div>
        <p id="info"></p>
    </div>

    <!-- Inclusion des fichiers JavaScript -->
    <script src="js/fakeGeoSim.js"></script>
    <script src="data/routes.js"></script>
    <script type="module" src="js/app.js"></script>

</body>

</html>
