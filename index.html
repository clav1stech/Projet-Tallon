<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Railway Timeline</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
</head>

<body>
    <div class="container">
        <h1>Railway Timeline</h1>
        <div class="form-row">
            <label for="routeSelect"><i class="fas fa-route"></i> Route selection:</label>
            <select id="routeSelect" >
                <option value="">-- Select a route --</option>
                <!-- Les options seront ajoutées dynamiquement via JavaScript -->
            </select>
        </div>
        <div class="form-row">
            <label for="departure-time"><i class="far fa-clock"></i> Departure time (HH:MM):</label>
            <input type="time" id="departure-time" required>
        </div>
        <div class="form-row">
            <label><i class="fas fa-map-marker-alt"></i> Location:</label>
            <div class="location-radio-group">
                <label><input type="radio" name="locationMethod" value="geo" checked> Use GPS</label>
                <label><input type="radio" name="locationMethod" value="manual"> Manual input</label>
            </div>
        </div>
        <div class="form-row" id="manualCoords" style="display:none;">
            <label for="manualLat"><i class="fas fa-map-marker-alt"></i> Lat/Lon:</label>
            <div class="latlon-group">
                <input type="number" id="manualLat" step="0.00001" placeholder="Latitude">
                <input type="number" id="manualLon" step="0.00001" placeholder="Longitude">
            </div>
        </div>
        <button id="start-btn" class="start-btn">Start</button>

        <!-- widget -->
        <div id="tracking-widget" class="tracking-widget">
            <div class="widget-section">
                <span class="widget-title">Last</span>
                <span id="last-passed-point"></span>
                <span id="last-point-distance"></span>
                <span class="theoretical-time" id="last-passed-theoretical"></span>
            </div>
            <div class="widget-section">
                <span class="widget-title">Next</span>
                <span id="next-point"></span>
                <span id="next-point-distance"></span>
                <span class="theoretical-time" id="next-point-theoretical"></span>
            </div>
            <div class="widget-section">
                <span id="current-time"></span>
            </div>
        </div>

        <br>

        <div id="timeline">
            <div class="station header">
                <span>Time</span>
                <span>Waypoint</span>
            </div>
        </div>
        <p id="info"></p>
    </div>

    <!-- Inclusion des fichiers JavaScript -->
    <script src="data/routes.js"></script>
    <script type="module" src="js/app.js"></script>

</body>

</html>
